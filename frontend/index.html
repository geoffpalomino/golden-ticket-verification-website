<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Ticket Verification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .hidden { display: none !important; }
        .loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 10; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 500px;">
        <div class="card shadow-sm text-center p-4" id="verification-card">
            <h2 class="mb-4">Verify Golden Ticket</h2>
            
            <div id="verify-section">
                <input type="text" id="ticket-input" class="form-control text-center fs-4 mb-3" placeholder="9-letter/number code" maxlength="11">
                <button id="verify-btn" class="btn btn-primary w-100">Verify Ticket</button>
                <div id="verify-msg" class="mt-3 text-danger fw-bold"></div>
            </div>

            <div id="student-form-section" class="hidden text-start mt-4 position-relative">
                <hr>
                <h4 class="text-success text-center mb-3">Ticket Valid!</h4>
                
                <div id="saved-data-view" class="hidden mb-3 p-3 bg-white border rounded">
                    </div>

                <form id="student-info-form">
                    <input type="text" id="firstName" class="form-control mb-2" placeholder="Student First Name" required>
                    <input type="text" id="lastName" class="form-control mb-2" placeholder="Student Last Name" required>
                    <input type="text" id="grade" class="form-control mb-2" placeholder="Student Grade" required>
                    <input type="text" id="school" class="form-control mb-3" placeholder="School Name" required>
                    <button type="submit" id="submit-info-btn" class="btn btn-success w-100">Submit</button>
                    
                    <div id="loading-indicator" class="loading-overlay hidden">
                        <div class="spinner-border text-primary" role="status"></div>
                        <span class="ms-2">Saving to database...</span>
                    </div>
                </form>
                <div id="success-msg" class="text-success fw-bold text-center mt-3 hidden">
                    Student info saved! Please keep the QR code and return the ticket to the student.
                </div>
            </div>

            <div class="mt-4 text-center">
                <button id="admin-login-btn" class="btn btn-link text-muted p-0 border-0">
                    <i class="bi bi-user-cog fs-4"></i>
                </button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
    <script src="admin.js"></script>
</body>
</html>
