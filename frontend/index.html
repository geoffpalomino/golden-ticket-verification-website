<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Ticket Verification</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body> <div class="container mt-5 ticket-container" style="max-width: 500px;">
        <div class="card p-4 golden-ticket" id="verification-card">
            <h2 class="mb-4 text-center header-gold">Verify Golden Ticket</h2>
            
            <div id="verify-section">
                <input type="text" id="ticket-input" class="form-control text-center fs-4 mb-3 aurum-input" placeholder="9-letter/number code" maxlength="11">
                <button id="verify-btn" class="btn btn-action w-100">Verify Ticket</button>
                <div id="verify-msg" class="mt-3 text-danger fw-bold text-center"></div>
            </div>

            <div id="student-form-section" class="hidden text-start mt-4 position-relative">
                <hr class="gold-divider">
                <h4 class="text-center mb-3 header-gold">Ticket Valid!</h4>
                
                <div id="saved-data-view" class="hidden mb-3 p-3 aurum-glass-panel rounded">
                </div>

                <form id="student-info-form">
                    <input type="text" id="firstName" class="form-control mb-2 aurum-input" placeholder="Student First Name" required>
                    <input type="text" id="lastName" class="form-control mb-2 aurum-input" placeholder="Student Last Name" required>
                    <input type="text" id="grade" class="form-control mb-2 aurum-input" placeholder="Student Grade" required>
                    <input type="text" id="school" class="form-control mb-3 aurum-input" placeholder="School Name" required>
                    <button type="submit" id="submit-info-btn" class="btn btn-action w-100">Submit</button>
                    
                    <div id="loading-indicator" class="loading-overlay hidden">
                        <div class="spinner-border text-warning" role="status"></div>
                        <span class="ms-2 text-light">Saving to vault...</span>
                    </div>
                </form>
                <div id="success-msg" class="text-warning fw-bold text-center mt-3 hidden">
                    Student info saved! Please keep the QR code and return the ticket.
                </div>
            </div>

            <div class="mt-4 text-center">
                <button id="admin-login-btn" class="btn btn-link text-muted p-0 border-0">
                    <i class="bi bi-shield-lock fs-4"></i>
                </button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
    <script src="admin.js"></script>
</body>
</html>
